<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vũ Thùy Dương - Bài tập CSS</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 40px 15px;
    font-family: Arial, Helvetica, sans-serif;
    background-color: #eef3f8;
    color: #2d2d2f;
}

.card {
    max-width: 600px;
    margin: 0 auto;
    padding: 35px 30px;
    background-color: #ffffff;
    border-radius: 14px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    text-align: center;
}

.avatar {
    width: 160px;
    height: 160px;
    object-fit: cover;
    border-radius: 50%;
    border: 4px solid #3ea4f0;
}

h1 {
    margin: 18px 0 6px;
    font-size: 30px;
}

.subtitle {
    margin: 0 0 20px;
    color: #666;
    font-size: 15px;
}

/* thông tin sinh viên */
.info {
    margin: 0 auto 25px;
    border-collapse: collapse;
    font-size: 16px;
}

.info td {
    padding: 6px 18px;
    border-bottom: 1px solid #e3e3e3;
    text-align: left;
}

.info td:first-child {
    font-weight: bold;
    color: #3ea4f0;
}

/* social link */
.social a {
    display: inline-block;
    width: 46px;
    height: 46px;
    margin: 0 6px;
    line-height: 46px;
    border-radius: 50%;
    background-color: #2d2d2f;
    color: #ffffff;
    font-size: 22px;
    text-decoration: none;
}

.social a:hover {
    background-color: #3ea4f0;
}

h2 {
    margin: 30px 0 15px;
    font-size: 20px;
    border-top: 1px solid #ddd;
    padding-top: 25px;
}

/* danh sách bài */
.baitap-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.baitap-list li {
    display: inline-block;
    margin: 5px;
}

.baitap-list a {
    display: inline-block;
    min-width: 120px;
    padding: 12px 16px;
    background-color: #3ea4f0;
    color: #ffffff;
    text-decoration: none;
    border-radius: 6px;
    font-size: 16px;
}

.baitap-list a:hover {
    background-color: #2d2d2f;
}
</style>
</head>
<body>

    <div class="card">
        <img class="avatar" src="images/avatar.jpg" alt="Ảnh đại diện">

        <h1>Vũ Thùy Dương</h1>
        <p class="subtitle">Bài tập Phát triển ứng dụng WEB/TMĐT</p>

        <table class="info">
            <tr><td>MSSV</td><td>31241024842</td></tr>
            <tr><td>MHP</td><td>26C1INF50902701</td></tr>
            <tr><td>Lớp</td><td>EE0001</td></tr>
            <tr><td>Khóa</td><td>50</td></tr>
        </table>

        <div class="social">
            <a href="https://www.facebook.com/thuy.duong.772190" target="_blank" title="Facebook"><i class="fab fa-facebook-f"></i></a>
            <a href="https://github.com/duongvu31241024842?tab=repositories" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
        </div>

        <h2><i class="fas fa-folder-open"></i> Danh sách bài tập</h2>

        <ul class="baitap-list">

            <li><a href="BaiTap2.html">Bài 2</a></li>
            <li><a href="BaiTap4.html">Bài 4</a></li>

            <li><a href="BaiTap8a.html">Bài 8a</a></li>
            <li><a href="BaiTap9.html">Bài 9</a></li>
        </ul>
    </div>
