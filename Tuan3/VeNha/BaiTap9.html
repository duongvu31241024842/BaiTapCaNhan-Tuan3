<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Khoa CNTTKD</title>

<!-- Font Awesome 5 -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #2d2d2f;
}

.best-shared {
    text-align: center;
    padding: 20px;
}

.logo {
    margin: 0 0 30px;
}

h2 {
    font-size: 52px;
    font-weight: normal;
    margin: 20px 0;
}

h2 strong {
    color: #3ea4f0;
}

h2 i {
    color: #3ea4f0;
    margin-right: 10px;
}

.lead-text {
    font-size: 18px;
    margin: 30px 0 20px;
}

/* hàng icon dịch vụ */
.services {
    margin: 0 0 50px;
}

.services span {
    display: inline-block;
    margin: 0 18px;
    font-size: 16px;
}

.services i {
    color: #3ea4f0;
    margin-right: 6px;
}

/* nút */
.btn-list {
    list-style: none;
    padding: 0;
    margin: 0;
}

.btn-list li {
    display: inline-block;
    margin: 0 15px;
}

.btn-list a {
    display: inline-block;
    width: 160px;
    padding: 25px 0;
    background-color: #2d2d2f;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    border-radius: 4px;
}

.btn-list a i {
    margin-right: 8px;
}
</style>
</head>
<body>
    <section class="best-shared">
        <p class="logo"><img style="width:200px" src="https://bit.ueh.edu.vn/wp-content/uploads/2017/06/BIT_logo.png" alt=""></p>
        <h2><i class="fas fa-server"></i>Best <strong>Shared Hosting</strong> Company</h2>
        <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>

        <p class="services">
            <span><i class="fas fa-server"></i>Hosting</span>
            <span><i class="fas fa-globe"></i>Domain</span>
            <span><i class="fas fa-envelope"></i>Email</span>
        </p>

        <ul class="btn-list">
            <li><a href="./"><i class="fas fa-tags"></i>View Plans</a></li>
            <li><a href="./"><i class="fas fa-star"></i>All Features</a></li>
        </ul>
    </section>
</body>
</html>
