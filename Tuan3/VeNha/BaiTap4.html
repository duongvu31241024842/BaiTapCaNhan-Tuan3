<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bài 4 - Menu ngang</title>
<style>
ul {
    list-style: none;       /* bỏ dấu chấm đầu dòng */
    padding: 0;
    margin: 20px;
}

li {
    display: inline-block;  /* các li nằm trên cùng 1 hàng */
    width: 120px;
    padding: 8px 0;
    margin-right: 8px;
    background-color: cyan;
    text-align: center;
    font-size: 18px;
}
</style>
</head>
<body>

    <ul>
        <li><a href="#">TMDT</a></li>
        <li><a href="#">ERP</a></li>
        <li><a href="#">MIS</a></li>
        <li><a href="#">DS</a></li>
    </ul>

</body>
</html>
